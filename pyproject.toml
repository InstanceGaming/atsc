[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "atsc"
version = "0.0.1"
description = "Actuated traffic signal controller suite."
authors = ["Jacob Jewett <jacoblj3333@gmail.com>"]
readme = "README.md"
packages = [{ include = "atsc" }]

[tool.poetry.dependencies]
python = "^3.11.2"
winloop = { version = "0.1.4", platform = "win32" }
uvloop = [
    { version = "0.21.0", platform = "linux" },
    { version = "0.21.0", platform = "darwin" }
]
asyncio = "3.4.3"
blinker = "1.9.0"
grpclib = "0.4.7"
grpcio-tools = "1.66.1"
betterproto = { version = "2.0.0b7", extras = ["compiler"] }
protobuf = "5.29.0"
pydantic = "2.10.2"
loguru = "0.7.2"
jacob = { git = "https://github.com/InstanceGaming/jacob.git", rev = "8505c3f4" }

[tool.poetry.group.fieldbus]
optional = true

[tool.poetry.group.fieldbus.dependencies]
aioserial = "1.3.1"
crcmod = "1.7"
bitarray = "2.9.2"

[tool.poetry.group.tui]
optional = true

[tool.poetry.group.tui.dependencies]
textual = "0.79.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
textual-dev = "1.6.1"

[tool.poetry.scripts]
atsc = "atsc.controller.main:run"
atsc-tui = "atsc.tui.main:run"
atsc-fb = "atsc.fieldbus.main:run"
atsc-net = "atsc.networking.main:run"
